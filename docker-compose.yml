  # --- API GATEWAY ---
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - USER_SERVICE_URL=http://user-service:8081
      - WORKER_SERVICE_URL=http://worker-service:8083
      - HOUSEHOLD_SERVICE_URL=http://household-service:8082
