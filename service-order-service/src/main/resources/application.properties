spring.application.name=service-order-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/order_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:order_service}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:order_password}
server.port=8084

spring.cloud.openfeign.okhttp.enabled=true
spring.cloud.openfeign.httpclient.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

household.service.url = http://localhost:8082
worker.service.url = http://localhost:8083
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha