spring.application.name=service-order-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/order_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:order_service}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:order_password}
server.port=8084

spring.cloud.openfeign.okhttp.enabled=true
spring.cloud.openfeign.httpclient.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/carelio-realm/protocol/openid-connect/certs
household.service.url=${HOUSEHOLD_SERVICE_URL:http://localhost:8082}
worker.service.url=${WORKER_SERVICE_URL:http://localhost:8083}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

spring.cache.type=redis
spring.cache.redis.time-to-live=6000000ms
spring.cache.redis.cache-null-values=false

spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

server.tomcat.connection-timeout=20000
spring.mvc.async.request-timeout=10000

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

feign.circuitbreaker.enabled=true

#Resilience4J properties
resilience4j.circuitbreaker.instances.default.register-health-indicator=true
resilience4j.circuitbreaker.instances.default.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.default.sliding-window-size=5
resilience4j.circuitbreaker.instances.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.default.automatic-transition-from-open-to-half-open-enabled=true