spring.application.name=service-order-service

# Database gi? nguyên
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/order_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:order_service}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:order_password}
server.port=8084

spring.cloud.openfeign.okhttp.enabled=true
spring.cloud.openfeign.httpclient.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ? FIX 1: ??i sang jwk-set-uri vì ???ng d?n tr? th?ng t?i /certs
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://carelio-keycloak:8080/realms/carelio-realm/protocol/openid-connect/certs

# ? FIX 2: C?u hình linh ho?t (N?u ch?y Docker thì l?y tên container, ch?y local thì l?y localhost)
household.service.url=${HOUSEHOLD_SERVICE_URL:http://localhost:8082}
worker.service.url=${WORKER_SERVICE_URL:http://localhost:8083}

# Swagger gi? nguyên
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ? FIX 3: ??i host sang tên m?ng c?a Redis trong Docker
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# B?t c?u hình cache lo?i Redis rõ ràng
spring.cache.type=redis
spring.cache.redis.time-to-live=6000000ms
spring.cache.redis.cache-null-values=false