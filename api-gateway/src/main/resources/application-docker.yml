server:
  port: 8000

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: user-service
          # Trỏ tới service theo DNS nội bộ của Docker (điều chỉnh port nếu service khác 8080)
          uri: http://user-service:8080
          predicates:
            - Path=/api/users/**
        - id: worker-service
          uri: http://worker-service:8080
          predicates:
            - Path=/api/workers/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
