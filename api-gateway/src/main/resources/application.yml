server:
  port: 8000

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # 1. Tuyến đường cho USER-SERVICE
        - id: user-service-route
          uri: ${USER_SERVICE_URL:http://localhost:8081} # <-- Nếu có biến USER_SERVICE_URL thì lấy, không thì mặc định localhost
          predicates:
            - Path=/api/users/**

        # 2. Tuyến đường cho WORKER-SERVICE
        - id: worker-service-route
          uri: ${WORKER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/workers/**

        # 3. Tuyến đường cho HOUSEHOLD-SERVICE
        - id: household-service-route
          uri: ${HOUSEHOLD_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/houses/**

        # 4. Tuyến đường cho SERVICE-ORDER-SERVICE
        - id: order-service-route
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/service-orders/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"